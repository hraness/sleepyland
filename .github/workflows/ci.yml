name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sleepyland-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Cloudflare's documented always-pass public test key. Production and
      # Preview use the hostname-restricted key configured in Vercel.
      NEXT_PUBLIC_HRANESS_MAILING_TURNSTILE_SITEKEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  required:
    name: Required
    if: always()
    needs: [application]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking job
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
        run: test "$APPLICATION_RESULT" = success
